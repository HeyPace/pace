# The pace repo root is the `pace-docs` Blume package only; `website/` is a
# separate pnpm root with its own dependencies.
packages: []

# Blume emits .blume/astro.config.mjs, which imports `astro/config` directly.
# Astro is therefore declared explicitly in package.json so pnpm's default
# isolated linker can preserve Blume's and Astro's distinct get-tsconfig versions.

onlyBuiltDependencies:
  - esbuild
  - sharp
