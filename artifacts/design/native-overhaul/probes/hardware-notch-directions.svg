<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120">
  <rect width="1500" height="1120" fill="#080A0D"/>

  <text x="84" y="82" fill="#F1F0EC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700">Pace · hardware-aware notch directions</text>
  <text x="84" y="124" fill="#A7AFBA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">Measured on this Mac: 1728×1117 display · 32pt top safe inset · 185pt physical camera housing</text>
  <line x1="84" y1="156" x2="1416" y2="156" stroke="#2A3039"/>

  <text x="84" y="212" fill="#F1F0EC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="23" font-weight="650">01 · Living Notch</text>
  <text x="84" y="242" fill="#4F8BFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="650">Recommended</text>
  <text x="235" y="242" fill="#A7AFBA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">Idle is the untouched hardware. A real voice state expands from its exact edges; click continues into the full panel.</text>

  <g transform="translate(84 270)">
    <rect width="640" height="190" rx="18" fill="#151922"/>
    <rect width="640" height="52" fill="#6F7787"/>
    <path d="M220 0 H420 V40 Q420 52 408 52 H232 Q220 52 220 40 Z" fill="#000000"/>
    <text x="24" y="86" fill="#8B9590" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">IDLE · 185×32pt</text>
    <line x1="220" y1="104" x2="420" y2="104" stroke="#2A3039" stroke-dasharray="4 5"/>
    <text x="320" y="135" text-anchor="middle" fill="#A7AFBA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">No Pace chrome</text>
  </g>

  <g transform="translate(776 270)">
    <rect width="640" height="190" rx="18" fill="#151922"/>
    <rect width="640" height="52" fill="#6F7787"/>
    <path d="M202 0 H438 V82 Q438 98 422 98 H218 Q202 98 202 82 Z" fill="#000000"/>
    <circle cx="235" cy="76" r="5" fill="#4F8BFF"/>
    <text x="252" y="82" fill="#F1F0EC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="650">Listening</text>
    <path d="M344 77 C360 68 374 86 390 77 C402 71 412 82 424 76" fill="none" stroke="#4F8BFF" stroke-width="3" stroke-linecap="round"/>
    <text x="24" y="132" fill="#8B9590" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">ACTIVE · 205×49pt</text>
    <text x="24" y="157" fill="#A7AFBA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Measured notch → named state → panel</text>
  </g>

  <line x1="84" y1="498" x2="1416" y2="498" stroke="#2A3039"/>

  <text x="84" y="554" fill="#F1F0EC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="23" font-weight="650">02 · Safe-Area Sidecar</text>
  <text x="84" y="584" fill="#A7AFBA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">The physical notch never changes. A state capsule appears only in the unobscured right menu-bar area and disappears when idle.</text>

  <g transform="translate(84 612)">
    <rect width="1332" height="176" rx="18" fill="#151922"/>
    <rect width="1332" height="52" fill="#6F7787"/>
    <path d="M566 0 H766 V40 Q766 52 754 52 H578 Q566 52 566 40 Z" fill="#000000"/>
    <rect x="784" y="10" width="164" height="32" rx="12" fill="#101318"/>
    <circle cx="805" cy="26" r="5" fill="#4F8BFF"/>
    <text x="820" y="31" fill="#F1F0EC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Understanding</text>
    <path d="M574 102 H758" stroke="#2A3039" stroke-dasharray="4 5"/>
    <text x="666" y="130" text-anchor="middle" fill="#A7AFBA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Hardware remains literal</text>
    <text x="866" y="102" text-anchor="middle" fill="#8B9590" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Uses auxiliaryTopRightArea</text>
  </g>

  <line x1="84" y1="830" x2="1416" y2="830" stroke="#2A3039"/>

  <text x="84" y="886" fill="#F1F0EC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="23" font-weight="650">03 · Activity Tray</text>
  <text x="84" y="916" fill="#A7AFBA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">Idle stays invisible. A meaningful event drops a compact tray below the notch; typing or clicking expands the same surface into conversation.</text>

  <g transform="translate(84 944)">
    <rect width="1332" height="138" rx="18" fill="#151922"/>
    <rect width="1332" height="52" fill="#6F7787"/>
    <path d="M566 0 H766 V40 Q766 52 754 52 H578 Q566 52 566 40 Z" fill="#000000"/>
    <path d="M466 46 H866 V112 Q866 128 850 128 H482 Q466 128 466 112 Z" fill="#101318" stroke="#2A3039"/>
    <circle cx="498" cy="82" r="6" fill="#4F8BFF"/>
    <text x="518" y="78" fill="#F1F0EC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="650">Pace is acting</text>
    <text x="518" y="101" fill="#A7AFBA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Opening Notes…</text>
    <text x="838" y="91" text-anchor="end" fill="#4F8BFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="650">Stop</text>
  </g>
</svg>
